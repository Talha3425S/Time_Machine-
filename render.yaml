services:
  - type: web
    name: software-time-machine-api
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: software-time-machine-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: software-time-machine-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false

  - type: keyvalue
    name: software-time-machine-cache
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: software-time-machine-db
    region: oregon
    plan: free
    databaseName: software_time_machine
    user: stm_user
